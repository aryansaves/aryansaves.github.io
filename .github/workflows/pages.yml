name: Build and deploy portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve Pages URL
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const owner = process.env.OWNER.toLowerCase();
          const repo = process.env.REPOSITORY.split('/')[1];
          const domain = process.env.CUSTOM_DOMAIN?.trim();
          if (domain && !/^(?=.{1,253}$)[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$/i.test(domain)) throw new Error('PAGES_CUSTOM_DOMAIN must be a hostname, without a scheme or path.');
          const base = domain || repo.toLowerCase() === `${owner}.github.io` ? '' : `/${repo}`;
          const site = domain ? `https://${domain}` : `https://${owner}.github.io${base}`;
          appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_BASE_PATH=${base}\nSITE_URL=${site}\n`);
          if (domain) writeFileSync('public/CNAME', `${domain}\n`);
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
